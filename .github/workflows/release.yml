name: Cross-Platform CI & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  rust-and-web-ci:
    name: Rust Core Tests & Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Rust core & bridge tests
        run: cargo test -p ov-core -p ov-bridge
      - name: Build frontend
        run: |
          npm ci
          npm run build

  tauri-release:
    name: Build Tauri v2 Bundle (${{ matrix.platform }})
    needs: rust-and-web-ci
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Linux Tauri system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Build ov-bridge sidecar
        run: cargo build --release -p ov-bridge ${{ matrix.args }}
      - name: Install frontend deps
        run: npm ci
      - name: Build Tauri v2 bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
