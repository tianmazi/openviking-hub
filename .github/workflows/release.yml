name: Cross-Platform CI & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  rust-and-web-ci:
    name: Rust Unit + E2E Tests & Frontend Build + E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Rust unit & full-stack E2E tests
        run: cargo test -p ov-core -p ov-bridge
      - name: Build frontend & run Frontend E2E smoke test
        run: |
          npm ci
          npm run build
          npm run test:e2e

  tauri-release:
    name: Build Tauri v2 Bundle (${{ matrix.label }})
    needs: rust-and-web-ci
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - label: macOS Intel
            platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - label: Linux x64
            platform: ubuntu-22.04
            target: ""
            args: ""
          - label: Windows x64
            platform: windows-latest
            target: ""
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Linux Tauri system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Build ov-bridge sidecar
        run: cargo build --release -p ov-bridge ${{ matrix.args }}
      - name: Install frontend deps
        run: npm ci
      - name: Build Tauri v2 bundle & publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "OpenViking Desktop ${{ github.ref_name }}"
          releaseBody: "Cross-platform Tauri v2 desktop builds (macOS Apple Silicon/Intel, Windows, Linux) for OpenViking Desktop."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
